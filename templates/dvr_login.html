<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Video Recorder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dvr.css') }}">
</head>
<body>
  <main class="panel">
    <header class="brand"><small>SECURE VIDEO SYSTEMS</small><h1>NETWORK VIDEO RECORDER</h1></header>
    <form method="post" action="{{ url_for('dvr.login') }}">
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <label for="username">User Name</label><input id="username" name="username" maxlength="128" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
      <button type="submit">LOGIN</button>
    </form>
    <footer class="footer">Device access · Local Network</footer>
  </main>
</body>
</html>
